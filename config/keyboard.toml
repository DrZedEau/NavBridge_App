# Slint logical key names. Multiple physical/logical keys may map to one action.
[bindings]
up = ["Up", "W"]
down = ["Down"]
left = ["Left"]
right = ["Right", "D"]
select = ["Return", "Space"]
back = ["Backspace"]
home = ["Escape", "Home"]
quit = ["Q"]
# Day or night mode from any page.
normal_mode = ["PageUp"]
night_mode = ["PageDown"]
# The parking brake, which lifts Android Auto's driving restrictions while on
# (from any page). Until the first press after the core starts, the car counts
# as moving.
parking_brake_on = ["Control", "ControlR"]
parking_brake_off = ["Alt"]

# Phone actions on the Android Auto screen (one command per press).
next_track = ["N"]
previous_track = ["B"]
voice_assistant = ["V"]
answer_call = ["A"]
end_call = ["E"]
phone_home = ["H"]
open_maps = ["M"]
open_media = ["S"]
# Pauses or resumes, depending on whether music is playing.
play_pause = ["P"]
