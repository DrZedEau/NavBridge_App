socket_path = "/run/navbridge/core.sock"
snapshot_interval_ms = 500

[android_auto]
dpi = 160
fps = 60
# "auto": the board's hardware H.264 decoder (Pi 4 / CM4), else software, as
# on the Pi 5 / CM5; "software" never tries the hardware one.
decoder = "auto"
left_hand_drive = true
# Optional paired PEM files for a custom AA accessory identity:
# certificate = "/opt/navbridge/config/headunit.crt"
# private_key = "/opt/navbridge/config/headunit.key"
# Development: with no phone on USB, use the phone's Android Auto head unit
# server (developer settings), forwarded by `adb forward tcp:5277 tcp:5277`.
# head_unit_server = "127.0.0.1:5277"

[ibus]
enabled = true
# The carrier board's ATmega32U4, which passes on each I-Bus frame it hears.
# Its by-id name stays the same whichever ttyACM number it gets.
device = "/dev/serial/by-id/usb-Arduino_LLC_Arduino_Micro_HIDPC-if00"
# Shut the Pi down when the cluster reports the ignition off: at once, or after
# shutdown_delay_s seconds unless it comes back on first (an engine restart,
# say). The board passes the ignition-off message on whatever the screen shows.
shutdown = true
shutdown_delay_s = 0

# What each of the car's buttons does, named as keyboard.toml names the
# actions; a button left out does nothing. Buttons: preset_1 to preset_6,
# next, previous, am, fm, mode, tone, menu, radio_menu, telephone, knob_press,
# knob_left, knob_right, select, info, wheel_next, wheel_previous,
# wheel_send_end, wheel_rt. These are the keys the firmware types.
[ibus.buttons]
preset_1 = "phone_home"
preset_2 = "back"
preset_3 = "play_pause"
preset_4 = "open_media"
preset_5 = "up"
preset_6 = "down"
next = "next_track"
previous = "previous_track"
knob_press = "select"
knob_left = "left"
knob_right = "right"
wheel_next = "next_track"
wheel_previous = "previous_track"
wheel_send_end = "voice_assistant"
wheel_rt = "answer_call"

[audio]
enabled = true
# plug converts rates/channels; dmix mixes music and navigation/assistant streams.
playback_device = 'plug:SLAVE="dmix:CARD=CODEC,DEV=0"'
capture_device = "plughw:CARD=CODEC,DEV=0"
