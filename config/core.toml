socket_path = "/run/navbridge/core.sock"
snapshot_interval_ms = 500

[android_auto]
dpi = 160
fps = 60
# "auto": the board's hardware H.264 decoder (Pi 4 / CM4), else software, as
# on the Pi 5 / CM5; "software" never tries the hardware one.
decoder = "auto"
left_hand_drive = true
# Optional paired PEM files for a custom AA accessory identity:
# certificate = "/opt/navbridge/config/headunit.crt"
# private_key = "/opt/navbridge/config/headunit.key"
# Development: with no phone on USB, use the phone's Android Auto head unit
# server (developer settings), forwarded by `adb forward tcp:5277 tcp:5277`.
# head_unit_server = "127.0.0.1:5277"

[ibus]
enabled = true
# The carrier board's ATmega32U4, which passes on each I-Bus frame it hears.
# Its by-id name stays the same whichever ttyACM number it gets.
device = "/dev/serial/by-id/usb-Arduino_LLC_Arduino_Micro_HIDPC-if00"

[audio]
enabled = true
# plug converts rates/channels; dmix mixes music and navigation/assistant streams.
playback_device = 'plug:SLAVE="dmix:CARD=CODEC,DEV=0"'
capture_device = "plughw:CARD=CODEC,DEV=0"
