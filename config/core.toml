socket_path = "/run/navbridge/core.sock"
snapshot_interval_ms = 500

[android_auto]
dpi = 160
# The video codec the phone is asked for: "h264", or "h265", which a phone
# without it ignores. Settings' choice replaces this one.
codec = "h264"
# "auto": the board's hardware decoder, for H.264 the Pi 4 / CM4's, for H.265
# the HEVC one of the Pi 4 and 5, else software, as for H.264 on the Pi 5 /
# CM5; "software" never tries the hardware one.
decoder = "auto"
left_hand_drive = true
# Optional paired PEM files for a custom AA accessory identity:
# certificate = "/opt/navbridge/config/headunit.crt"
# private_key = "/opt/navbridge/config/headunit.key"
# Development: with no phone on USB, use the phone's Android Auto head unit
# server (developer settings), forwarded by `adb forward tcp:5277 tcp:5277`.
# head_unit_server = "127.0.0.1:5277"

[ibus]
enabled = true
# The carrier board's ATmega32U4, which passes on each I-Bus frame it hears.
# Its by-id name stays the same whichever ttyACM number it gets.
device = "/dev/serial/by-id/usb-Arduino_LLC_Arduino_Micro_HIDPC-if00"
# Shut the Pi down when the cluster reports the ignition off: at once, or after
# shutdown_delay_s seconds unless it comes back on first (an engine restart,
# say). The board passes the ignition-off message on whatever the screen shows.
shutdown = true
shutdown_delay_s = 0

# What each of the car's buttons does, as button = "command", while the core
# reads the I-Bus. A button left out does nothing. A button takes one command,
# but a command can be on several buttons, and a misspelt name stops the core
# at start. The commands are named as in keyboard.toml, which alone has quit.
# The table below is the keys the firmware types.
#
# A button acts once, when it is pressed: holding it or letting it go does
# nothing more. Each detent of the knob counts as one press.
#
# The car's buttons. On the board monitor:
#   preset_1 to preset_6        the six preset keys
#   next, previous              the arrows, > and <
#   am, fm, mode, tone          the radio's keys of those names
#   radio_menu, menu            the RADIO and MENU keys
#   telephone                   the telephone key
#   knob_press                  pressing the knob
#   knob_left, knob_right       turning the knob anticlockwise or clockwise
#   select, info                the SELECT and INFO soft keys
# On the steering wheel:
#   wheel_next, wheel_previous  the + and - keys
#   wheel_send_end              the send/end key
#   wheel_rt                    the R/T key
# The board itself uses telephone and the radio's own buttons to switch the
# screen, which is why the table leaves them out.
#
# Commands for Android Auto, which act only while its screen shows a phone:
#   next_track, previous_track  the next or previous track
#   play_pause                  pauses or resumes
#   voice_assistant             opens the phone's assistant
#   answer_call                 answers a call
#   end_call                    hangs up, or rejects an incoming call
#   phone_home                  Android Auto's own home screen
#   open_maps                   the phone's navigation app, such as Google Maps
#   open_media                  the phone's media screen
#
# Commands that move around, on Android Auto's screen and on NavBridge's pages:
#   up, down        Android Auto: to another region of its screen. NavBridge:
#                   up the previous, down the next tile, row or page.
#   left, right     Android Auto: the previous or next item within a region, as
#                   a rotary controller does. NavBridge: as up and down.
#   select          Android Auto: clicks the chosen item. NavBridge: opens a
#                   tile or row, or accepts a phone's pairing.
#   back            Android Auto: goes back on the phone. NavBridge: back to
#                   the menu, or refuses a phone's pairing.
# On a row opened in Settings, right and up raise its value, left and down
# lower it.
#
# Commands for NavBridge itself, on any page:
#   home                NavBridge's menu, with a phone's session still running
#   normal_mode         Android Auto's day mode, until the low beam changes
#   night_mode          Android Auto's night mode, until the low beam changes
#   parking_brake_on, parking_brake_off
#                       no effect here: while the I-Bus is read, the car's
#                       handbrake is the parking brake
[ibus.buttons]
preset_1 = "phone_home"
preset_2 = "back"
preset_3 = "play_pause"
preset_4 = "open_media"
preset_5 = "up"
preset_6 = "down"
next = "next_track"
previous = "previous_track"
knob_press = "select"
knob_left = "left"
knob_right = "right"
wheel_next = "next_track"
wheel_previous = "previous_track"
wheel_send_end = "voice_assistant"
wheel_rt = "answer_call"

[audio]
enabled = true
# plug converts rates/channels; dmix mixes music and navigation/assistant streams.
playback_device = 'plug:SLAVE="dmix:CARD=CODEC,DEV=0"'
capture_device = "plughw:CARD=CODEC,DEV=0"
