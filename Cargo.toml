[workspace]
members = [
    "crates/common",
    "crates/core",
    "crates/ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/DrZedEau/NavBridge_App"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
# A panic in any thread ends the process, for systemd to start it again,
# instead of leaving it running without the thread that died.
panic = "abort"
